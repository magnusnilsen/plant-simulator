[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-sim"
version = "0.1.0"
description = "Multiscale plant growth simulator — germination through early seedling growth."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "websockets>=14",
  "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["sim"]

[tool.pytest.ini_options]
testpaths = ["sim/tests"]
pythonpath = ["sim"]
addopts = "-q"
